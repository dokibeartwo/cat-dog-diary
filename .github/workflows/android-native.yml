name: Android native internal APK
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Optional: retest the existing APK from this repository run without recompiling'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPO_NO_TELEMETRY: '1'
      # This milestone is explicitly offline; never embed project credentials.
      EXPO_PUBLIC_SUPABASE_URL: ''
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install and verify
        if: ${{ !inputs.apk_run_id }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run check
          cd apps/android
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run verify:config
      - name: Generate Android native project
        if: ${{ !inputs.apk_run_id }}
        working-directory: apps/android
        run: npm run prebuild
      - name: Compile self-contained internal APK
        if: ${{ !inputs.apk_run_id }}
        working-directory: apps/android/android
        timeout-minutes: 22
        env:
          NODE_ENV: production
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        # Expo template signs release with its debug key unless an owner key
        # is explicitly configured. This artifact is INTERNAL, not a stable
        # public release. It embeds JS and does not need a Metro dev server.
        run: |
          chmod +x gradlew
          mkdir -p ../smoke-output
          free -m
          df -h .
          ./gradlew assembleRelease --no-daemon --no-parallel --max-workers=2 --console=plain --info --stacktrace -PreactNativeArchitectures=arm64-v8a,x86_64 2>&1 | tee ../smoke-output/native-build.log
      - name: Native build failure diagnostics
        if: ${{ failure() && !inputs.apk_run_id }}
        run: |
          mkdir -p apps/android/smoke-output
          {
            date -u
            free -m
            df -h .
            ps -eo pid,comm,pcpu,pmem,rss --sort=-rss | head -25
          } > apps/android/smoke-output/build-resources.txt
      - name: Upload internal APK
        if: ${{ !inputs.apk_run_id }}
        uses: actions/upload-artifact@v4
        with:
          name: cat-dog-diary-android-internal
          path: apps/android/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
      - name: Validate source APK run
        if: ${{ inputs.apk_run_id }}
        env:
          APK_SOURCE_RUN: ${{ inputs.apk_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node apps/android/scripts/apk-provenance.cjs
      - name: Record freshly built APK source
        if: ${{ !inputs.apk_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/android/scripts/apk-provenance.cjs
      - name: Reuse the original APK bytes
        if: ${{ inputs.apk_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: cat-dog-diary-android-internal
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
          path: apps/android/android/app/build/outputs/apk/release
      - name: Record APK checksum and verify smoke selectors
        run: |
          npm ci --prefix scripts/android-qa --ignore-scripts --no-audit --no-fund
          mkdir -p apps/android/smoke-output
          sha256sum apps/android/android/app/build/outputs/apk/release/app-release.apk > apps/android/smoke-output/APK-SHA256.txt
          node --test apps/android/tests/ui-tree.test.mjs
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installed APK smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install apps/android/android/app/build/outputs/apk/release/app-release.apk
            node apps/android/scripts/emulator-smoke.cjs
      - name: Save APK screenshots and device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-dog-diary-android-smoke
          path: apps/android/smoke-output
          if-no-files-found: ignore
          retention-days: 14
