name: Mobile web preview

# Explicit publication only. Desktop/Android edits do not start web or APK builds.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-preview-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test example-data rules
        run: npm test
      - name: Build and audit static files
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify the public project path and real interactions
        run: npm run test:ui
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified example-data site
        id: deployment
        uses: actions/deploy-pages@v4
