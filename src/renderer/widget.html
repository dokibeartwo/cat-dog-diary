<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>猫狗日记小组件</title>
    <link rel="stylesheet" href="widget.css" />
    <link rel="stylesheet" href="theme-previews.css" />
    <link rel="stylesheet" href="widget-focus.css" />
    <link rel="stylesheet" href="confirm-dialog.css" />
  </head>
  <body>
    <main class="widget-shell">
      <div class="ambient one"></div>
      <div class="ambient two"></div>
      <header class="widget-header drag-region">
        <div class="mini-brand"><img src="assets/bear-authenticity.png" alt="王王碎小熊标识" /><div class="brand-copy"><strong>猫狗日记</strong><small>王王碎小熊</small></div></div>
        <div class="header-actions no-drag">
          <button id="openMain" aria-label="打开主界面" title="打开主界面">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7h8v8M17 7l-9 9" /><path class="soft-stroke" d="M14 17H7V10" /></svg>
          </button>
          <button id="hideWidget" aria-label="关闭小组件" title="关闭小组件">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8 8 8M16 8l-8 8" /></svg>
          </button>
        </div>
      </header>

      <section id="focusWidget" class="focus-widget" aria-label="专注小组件" hidden>
        <span id="widgetFocusStatus" class="focus-widget-status">专注中</span>
        <span class="focus-widget-label" id="widgetFocusLabel">当前任务</span>
        <strong id="widgetFocusTask" class="focus-widget-task">自由专注</strong>
        <time id="widgetCountdown" class="widget-countdown">25:00</time>
        <div class="focus-widget-track" role="progressbar" aria-label="本轮进度" aria-valuemin="0" aria-valuemax="100"><span id="widgetFocusProgress"></span></div>
        <div class="focus-widget-actions"><button id="widgetPause" type="button">Ⅱ 暂停</button><button id="widgetExpand" type="button">↗ 返回大屏</button></div>
        <p id="widgetFocusError" role="alert"></p>
      </section>

      <section class="widget-hero">
        <div>
          <p id="dateLabel">今天</p>
          <h1><span id="remainingCount">0</span> 件事<br />正在等你</h1>
        </div>
        <div class="mini-progress" id="miniProgress" style="--progress: 0">
          <strong id="progressValue">0%</strong>
        </div>
      </section>

      <section class="widget-tasks" id="widgetTasks" aria-live="polite"></section>

      <footer>
        <button id="footerOpen">打开完整清单 <span>→</span></button>
        <p id="footerMessage">只做下一件，就很好。</p>
      </footer>

      <div class="widget-burst" id="widgetBurst" aria-hidden="true"></div>
      <div class="micro-reward" id="microReward"><span>✓</span><strong>拿下！</strong></div>
    </main>
    <script src="../shared/domain.js"></script>
    <script src="confirm-dialog.js"></script>
    <script src="window-ready.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
